<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>公図閲覧</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.2/proj4.js"></script>

    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f5f7; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; }
        
        /* 上部コントロールパネル */
        .control-panel {
            position: absolute; top: 10px; left: 10px; right: 10px;
            background: rgba(255, 255, 255, 0.95);
            padding: 12px; border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            z-index: 1000; display: flex; flex-direction: column; gap: 8px;
        }
        .row { display: flex; gap: 8px; align-items: center; }
        
        /* UIパーツのサイズ調整 */
        select {
            padding: 8px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px;
            background: white; height: 40px; box-sizing: border-box;
            flex: 0 0 80px; /* 第6系専用に幅を固定 */
        }
        input[type="file"] {
            padding: 8px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px;
            background: white; height: 40px; box-sizing: border-box;
            flex: 1; /* 残りの幅をすべて使う */
        }
        button {
            padding: 8px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px;
            flex: 1; height: 40px; box-sizing: border-box;
            background: #2e7d32; color: white; border: none; font-weight: bold; cursor: pointer;
        }
        button:active { background: #1b5e20; }
        
        /* 位置情報表示用ステータス */
        #status-bar {
            position: absolute; bottom: 20px; left: 10px; right: 10px;
            background: rgba(0, 0, 0, 0.75); color: white; padding: 8px 12px;
            border-radius: 6px; font-size: 12px; z-index: 1000; text-align: center;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="control-panel">
        <div class="row">
            <select id="zone-select">
                <option value="6" selected>第6系</option>
            </select>
            <input type="file" id="file-input" accept=".geojson,.json" />
        </div>
        <div class="row">
            <button id="gps-focus-btn" onclick="focusCurrentLocation()">現在地へフォーカス</button>
        </div>
    </div>

    <div id="map"></div>
    <div id="status-bar">GPS読込中... / データ未読込</div>

    <script>
        // 1. 地図の初期化
        const map = L.map('map', { zoomControl: false }).setView([36.0, 136.0], 9);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // 背景地図タイルの定義
        const chiriinChikei = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
            attribution: '&copy; 国土地理院 (標準地図)'
        });
        const chiriinOrtho = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/ort/{z}/{x}/{y}.jpg', {
            attribution: '&copy; 国土地理院 (オルソ航空写真)'
        });

        chiriinChikei.addTo(map);

        const baseMaps = {
            "地形図（標準）": chiriinChikei,
            "オルソ写真": chiriinOrtho
        };
        L.control.layers(baseMaps, null, { position: 'bottomright' }).addTo(map);

        // 2. 平面直角座標系の原点緯度経度データ (第6系のみ使用しますが定義は残します)
        const zoneOrigins = {
            6: [36.0, 136.0]
        };

        // 3. GeoJSON読み込みと座標変換
        let geojsonLayer = null;
        document.getElementById('file-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const selectedZone = document.getElementById('zone-select').value;
            const origin = zoneOrigins[selectedZone];
            
            const jgd2011 = `+proj=tmerc +lat_0=${origin[0]} +lon_0=${origin[1]} +k=0.9999 +x_0=0 +y_0=0 +ellps=GRS80 +units=m +no_defs`;
            const wgs84 = "+proj=longlat +ellps=WGS84 +datum=WGS84 +no_defs";

            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    let geoData = JSON.parse(evt.target.result);

                    function convertCoords(coords) {
                        if (typeof coords[0] === 'number') {
                            const y = coords[0]; 
                            const x = coords[1];
                            const converted = proj4(jgd2011, wgs84, [y, x]);
                            coords[0] = converted[0]; 
                            coords[1] = converted[1]; 
                        } else {
                            coords.forEach(convertCoords);
                        }
                    }

                    geoData.features.forEach(feature => {
                        convertCoords(feature.geometry.coordinates);
                    });

                    if (geojsonLayer) map.removeLayer(geojsonLayer);

                    geojsonLayer = L.geoJSON(geoData, {
                        style: { color: '#ff3388', weight: 3, fillOpacity: 0.1 },
                        onEachFeature: function (feature, layer) {
                            const props = feature.properties || {};
                            const chiban = props['地番'] || props['chiban'] || props['block_id'] || props['movable_attribute_chiban'] || '不明';
                            
                            layer.bindPopup(`<b>地番: ${chiban}</b><br><small>${JSON.stringify(props)}</small>`);
                            layer.bindTooltip(chiban, { permanent: false, direction: 'center', className: 'polygon-label' });
                        }
                    }).addTo(map);

                    // 読み込んだデータに画面をフィットさせる
                    const bounds = geojsonLayer.getBounds();
                    map.fitBounds(bounds);
                    
                    updateStatusBar(`データ読込成功: ${file.name}`);

                } catch (err) {
                    alert("ファイルのパースまたは変換に失敗しました: " + err.message);
                }
            };
            reader.readAsText(file);
        });

        // 4. GPSのバックグラウンド取得とフォーカス処理
        let watchId = null;
        let currentMarker = null;
        let accuracyCircle = null;
        let currentLat = null;
        let currentLng = null;
        let isFirstLocation = true; // 初回フォーカス判定用フラグ

        // ステータスバーのテキスト更新用ヘルパー（読み込みデータ名とGPS状況を併記するため）
        let fileStatusText = "データ未読込";
        function updateStatusBar(fileText = null, gpsText = null) {
            if(fileText) fileStatusText = fileText;
            const gpsInfo = (currentLat && currentLng) ? `GPS取得中` : `GPS検索中...`;
            document.getElementById('status-bar').innerText = `${gpsInfo} / ${fileStatusText}`;
        }

        // 起動時に自動でGPS取得開始
        function initGPS() {
            if (!navigator.geolocation) {
                alert("お使いの端末はGPSに対応していません。");
                return;
            }
            
            watchId = navigator.geolocation.watchPosition(
                function(position) {
                    currentLat = position.coords.latitude;
                    currentLng = position.coords.longitude;
                    const accuracy = position.coords.accuracy;

                    // マーカーと円の描画・更新
                    if (currentMarker) {
                        currentMarker.setLatLng([currentLat, currentLng]);
                        accuracyCircle.setLatLng([currentLat, currentLng]).setRadius(accuracy);
                    } else {
                        currentMarker = L.marker([currentLat, currentLng]).addTo(map).bindPopup("現在地");
                        accuracyCircle = L.circle([currentLat, currentLng], { radius: accuracy, color: '#137cbd', fillOpacity: 0.15 }).addTo(map);
                    }

                    // 初回座標取得時のみ、自動でその場所へフォーカスする
                    if (isFirstLocation) {
                        map.setView([currentLat, currentLng], 16);
                        isFirstLocation = false;
                    }

                    updateStatusBar();
                },
                function(error) {
                    console.warn("GPSエラー:", error.message);
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        // 「現在地へフォーカス」ボタンを押したときの処理
        function focusCurrentLocation() {
            if (currentLat !== null && currentLng !== null) {
                // ズームレベル18（かなり拡大）で現在地へ移動
                map.setView([currentLat, currentLng], 18);
            } else {
                alert("GPS座標を取得中です。空が見える場所で少しお待ちください。");
            }
        }

        // 画面読み込み完了と同時にGPS起動
        window.addEventListener('load', initGPS);

        // 5. サービスワーカーの登録
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('sw.js').then(function(reg) {
                    console.log('ServiceWorkerの登録に成功しました: ', reg.scope);
                }, function(err) {
                    console.log('ServiceWorkerの登録に失敗しました: ', err);
                });
            });
        }
    </script>
</body>
</html>
